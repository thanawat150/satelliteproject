name: Build Real Satellite Infographic
on:
  push:
    branches: [main]
    paths:
      - 'docs/reports/Rayong_Real_Satellite_Infographic_2026.html'
      - 'scripts/build_real_satellite_infographic.cjs'
      - '.github/workflows/rayong-real-satellite-infographic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chrome renderer and Thai fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-thai-tlwg poppler-utils
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          google-chrome --version
      - name: Serve report data
        run: |
          nohup python3 -m http.server 8765 --directory docs > /tmp/infographic-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/reports/Rayong_Real_Satellite_Infographic_2026.html -o /dev/null && break
            sleep 1
          done
      - name: Verify data and render exact pixels
        run: node scripts/build_real_satellite_infographic.cjs
      - name: Publish diagnostic message for investigation
        if: failure()
        run: |
          if [ -f docs/reports/real_satellite_infographic_build_error.txt ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/reports/real_satellite_infographic_build_error.txt
            git commit -m "Report real satellite infographic preview build diagnostics" || true
            git push origin HEAD:main
          fi
      - name: Archive diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-satellite-infographic-diagnostics
          path: docs/reports/real_satellite_infographic_build_error.txt
          if-no-files-found: ignore
      - name: Archive report files
        uses: actions/upload-artifact@v4
        with:
          name: Rayong-Real-Satellite-Infographic
          path: |
            docs/reports/Rayong_Real_Satellite_Infographic_2026.png
            docs/reports/Rayong_Real_Satellite_Infographic_2026.pdf
          if-no-files-found: error
      - name: Publish actual infographic exports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reports/Rayong_Real_Satellite_Infographic_2026.png docs/reports/Rayong_Real_Satellite_Infographic_2026.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Publish one-page infographic built from actual Sentinel-2 previews"
            git push origin HEAD:main
          fi

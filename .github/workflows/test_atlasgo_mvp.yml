name: AtlasGo MVP Browser Smoke
on:
  push:
    branches: [main]
    paths:
      - "docs/ai-travel-companion/**"
      - "scripts/test_atlasgo_mvp.cjs"
      - ".github/workflows/test_atlasgo_mvp.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript syntax
        run: |
          node --check docs/ai-travel-companion/app.js
          node --check scripts/test_atlasgo_mvp.cjs
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start static site server
        run: |
          python -m http.server 8877 --bind 127.0.0.1 --directory docs >/tmp/atlasgo.log 2>&1 &
      - name: Browser smoke - desktop and mobile
        run: node scripts/test_atlasgo_mvp.cjs

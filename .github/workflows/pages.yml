name: Publish Flood Monitoring Portal

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "scripts/validate_portal.py"
      - "scripts/derive_daily_monitoring.py"
      - "scripts/nationwide_process.py"
      - "scripts/nationwide_inventory.py"
      - "scripts/nationwide_scope_136.py"
      - "scripts/validate_nationwide.py"
      - "scripts/test_monitoring_qa_alerts.cjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["MMC Build True Satellite RGB and Index Maps"]
    types: [completed]
  # 08:15 Thailand daily; also runs automatically on website changes.
  schedule:
    - cron: "15 1 * * *"

permissions:
  contents: write

concurrency:
  group: "publish-gh-pages"
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Validate portal data
        run: |
          python scripts/validate_portal.py
          python scripts/validate_nationwide.py

      - name: Check JavaScript syntax for the portal
        run: |
          node --check docs/app.js
          node --check docs/calendar.js
          node --check docs/map-studio.js
          node --check docs/trend-report.js
          node --check docs/nationwide.js
          node --check docs/nationwide-catalog.js
          node --check docs/report-selector.js
          node --check docs/monitoring-studio.js
          node --check docs/monitoring-qa.js
          node --check docs/alert-engine.js
          node --check docs/alert-center.js
          node scripts/test_monitoring_qa_alerts.cjs
          node --check docs/live-report-model.js
          node scripts/test_live_report.cjs
          python -m py_compile scripts/derive_daily_monitoring.py scripts/nationwide_process.py scripts/nationwide_inventory.py scripts/nationwide_scope_136.py

      # Refresh directly in the published docs snapshot without changing main.
      # If provider is down, keep the last known, explicitly dated reference prices.
      - name: Refresh coastal-trip fuel prices (Bangchak API)
        continue-on-error: true
        run: |
          node --check scripts/refresh_trip_fuel_prices.cjs
          node scripts/refresh_trip_fuel_prices.cjs

      - name: Prepare static site
        run: |
          rm -rf /tmp/flood-site
          mkdir -p /tmp/flood-site
          cp -a docs/. /tmp/flood-site/

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || true
          git checkout --orphan _publish
          git rm -rf .
          cp -a /tmp/flood-site/. .
          git add -A
          git commit -m "Publish portal from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages

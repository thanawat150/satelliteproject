name: Recover missing PDD Sentinel-2 TIFF analyses

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/nationwide_retry.py"
      - ".github/workflows/nationwide-retry.yml"

permissions:
  contents: write

concurrency:
  group: nationwide-retry-missing
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image analysis and Drive downloader
        run: python -m pip install numpy rasterio shapely pyproj pillow "gdown==6.4.2"
      - name: Discover and download exact paired TIFF IDs
        run: |
          python scripts/nationwide_retry.py process \
            --shard "${{ matrix.shard }}" --shards 8 \
            --out "work/shard-${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retry-shard-${{ matrix.shard }}
          path: work/shard-${{ matrix.shard }}/
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: [retry]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: retry-shard-*
          path: work/parts
      - name: Merge retry results without replacing previous QA
        run: |
          python scripts/nationwide_retry.py merge \
            --parts work/parts --shards 8 \
            --out docs/data/nationwide
      - name: Validate scope and prior QA preservation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("docs/data/nationwide")
          r=json.loads((p/"nationwide_results.json").read_text())
          s=json.loads((p/"nationwide_run_status.json").read_text())
          assert len(r["plots"])==s["requested_plots"]==136
          assert len({(x["plot"],x["date"]) for x in r["scenes"]})==len(r["scenes"])
          assert s["processed_plots"]>=67
          assert s["totals"]["qa_valid_dates"]>=95
          assert r["last_retry"]["new_scenes"]>0
          print("NATIONWIDE_QA_VALIDATED",s["totals"])
          PY
      - name: Commit results to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/nationwide/nationwide_results.json \
            docs/data/nationwide/nationwide_features.geojson \
            docs/data/nationwide/nationwide_run_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Recover missing PDD TIFF scenes without QA regression"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

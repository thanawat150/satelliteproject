name: Build Rayong Monitoring Report PDF
on:
  push:
    branches: [main]
    paths:
      - 'docs/reports/Rayong_Plot_Assessment_2026.html'
      - 'scripts/build_rayong_pdf.cjs'
      - '.github/workflows/rayong-report-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser renderer and Thai fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-thai-tlwg poppler-utils
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          google-chrome --version

      - name: Serve public satellite dataset
        run: |
          nohup python3 -m http.server 8765 --directory docs > /tmp/rayong-report-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/reports/Rayong_Plot_Assessment_2026.html -o /dev/null && break
            sleep 1
          done

      - name: Render and validate A4 PDF
        run: node scripts/build_rayong_pdf.cjs

      - name: Upload final PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rayong-19-Plots-Draft-Report-PDF
          path: docs/reports/Rayong_Plot_Assessment_2026.pdf
          if-no-files-found: error

      - name: Commit completed PDF for public download
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reports/Rayong_Plot_Assessment_2026.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Publish Rayong 19-plot draft report PDF (B/C illustrative grades)"
            git push origin HEAD:main
          fi

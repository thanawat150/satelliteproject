name: MMC Historical Rain and Marine Model Context
on:
  push:
    branches: [main]
    paths:
      - "scripts/mmc_rainfall_baseline.py"
      - "scripts/mmc_sea_level_model.py"
      - ".github/workflows/mmc-hydro-context.yml"
  workflow_dispatch:
    inputs:
      max_plots:
        description: "New plots to backfill per data source"
        type: string
        default: "126"
  schedule:
    - cron: "45 1 * * *"
permissions:
  contents: write
concurrency:
  group: mmc-hydro-context-data
  cancel-in-progress: false
jobs:
  rain-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "shapely>=2,<3"
      - name: Download 2016-2025 NASA POWER seasonal rainfall reference
        env:
          MAX_PLOTS: ${{ inputs.max_plots || '126' }}
        run: python scripts/mmc_rainfall_baseline.py --max-plots "$MAX_PLOTS"
      - name: Validate documented baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("docs/mangrove-monitoring/environmental_rain_baselines.json").read_text())
          assert j["plots_with_reference"]>0
          for plot,x in j["plots"].items():
              assert x["baseline_years"]=="2016–2025"
              for day,row in x["results"].items():
                  for k,v in row.items():
                      if v["status"]=="SEASONAL_REFERENCE_READY":
                          assert 0<=v["percentile"]<=100 and v["sample_count"]>=100
          print("SEASONAL_BASELINE_VERIFIED",j["plots_with_reference"])
          PY
      - name: Publish rain seasonal reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/mangrove-monitoring/environmental_rain_baselines.json
          if ! git diff --cached --quiet; then
            git commit -m "data(mmc): add verified ten-year seasonal NASA POWER baselines"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
  marine-model:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [rain-baseline]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "shapely>=2,<3"
      - name: Fetch coastal sea level model with provider attribution
        env:
          MAX_PLOTS: ${{ inputs.max_plots || '126' }}
        run: python scripts/mmc_sea_level_model.py --max-plots "$MAX_PLOTS"
      - name: Verify not relabeled as tide-gauge readings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("docs/mangrove-monitoring/environmental_sea_level_model.json")
          d=json.loads(p.read_text())
          assert d["type"]=="NUMERICAL_MODEL_NOT_TIDE_GAUGE"
          assert d["gauge_status"].startswith("NOT_CONNECTED")
          for plot,v in d["plots"].items():
              for date,row in v["scenes"].items():
                  assert row["level_at_overpass_m"] is None
                  assert row["overpass_utc"] is None
          print("COASTAL_MODEL_SOURCE_VERIFIED",len(d["plots"]))
          PY
      - name: Publish modelled sea level provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/mangrove-monitoring/environmental_sea_level_model.json
          if ! git diff --cached --quiet; then
            git commit -m "data(mmc): record Open-Meteo coastal model distinct from verified tide gauges"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi

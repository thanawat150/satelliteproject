name: Test Satellite Monitoring Engine
on:
  push:
    branches: [main]
    paths:
      - "scripts/derive_daily_monitoring.py"
      - "scripts/test_derive_monitoring.py"
      - ".github/workflows/test_monitor_engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scientific dependencies
        run: python -m pip install --disable-pip-version-check "numpy>=1.24,<3" "rasterio>=1.3,<2" "shapely>=2,<3" "pyproj>=3.5,<4"
      - name: Test pixel QA, polygon footprints, water change and one-time processing
        run: python scripts/test_derive_monitoring.py

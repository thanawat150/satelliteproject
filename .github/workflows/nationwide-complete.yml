name: Complete PDD nationwide Sentinel-2 analysis

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/nationwide_finish.py"
      - "docs/data/nationwide/source_plot_folders.json"
      - ".github/workflows/nationwide-complete.yml"

permissions:
  contents: write

concurrency:
  group: nationwide-complete-136
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install geospatial and Google Drive dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy rasterio shapely pyproj pillow gdown
      - name: Process original TIFF data for assigned PDD plots
        run: |
          python scripts/nationwide_finish.py process \
            --shard "${{ matrix.shard }}" --shards 8 \
            --out "work/shard-${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: work/shard-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [process]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: work/parts
      - name: Merge and validate all 136 PDD plot statuses
        run: |
          python scripts/nationwide_finish.py merge \
            --parts work/parts --shards 8 \
            --out docs/data/nationwide
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("docs/data/nationwide/nationwide_run_status.json")
          s=json.loads(p.read_text())
          assert s["requested_plots"]==136
          assert s["processed_plots"]>=11, "No new plots analyzed: abort publication"
          print("PUBLISH_VALIDATED",s["totals"])
          PY
      - name: Commit audited outputs to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/nationwide/nationwide_results.json \
                  docs/data/nationwide/nationwide_features.geojson \
                  docs/data/nationwide/nationwide_run_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish completed original TIFF QA analyses across PDD plots"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

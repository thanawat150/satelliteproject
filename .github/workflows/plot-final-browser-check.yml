name: Verify Plot Final Browser Flow
on:
  push:
    paths:
      - 'scripts/e2e_plot_final.cjs'
      - '.github/workflows/plot-final-browser-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright test client
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2

      - name: Verify Chrome is available
        run: google-chrome --version

      - name: Exercise deployed report controls
        run: node scripts/e2e_plot_final.cjs

      - name: Save screenshot (if generated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rayong-plot-final-browser-check
          path: artifacts/
          if-no-files-found: ignore

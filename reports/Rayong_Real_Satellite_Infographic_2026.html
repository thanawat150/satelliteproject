</style></head><body><main id="poster"></main><script>(async function(){
"use strict";
const qs=(s)=>document.querySelector(s);
const esc=x=>String(x??"").replace(/[&<>"']/g,k=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[k]||k));

 "../data/plots.json","../data/analysis_history.json","../data/full_preview_part_2.json","../data/boundaries.geojson"
].map(async u=>{const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw Error("ไม่สามารถโหลด "+u+" : "+r.status);return r.json()}));

if(!mainMeta)throw Error("Missing main plot 14-VSD");
const mainRows=hist.plots["14-VSD"]||[];
const byDate=d=>mainRows.find(x=>x.date===d);

const priority={DIRECT:0,LATEST_RECT:1,HIST_CLEAR_RECT_SCL0:2,NO_CLOUD_FILTER:3};
const getLayer=(date,mode)=>mainData.filter(x=>x.date===date&&x.mode===mode&&x.src).sort((a,b)=>(priority[a.source_suffix]??5)-(priority[b.source_suffix]??5))[0];
const polygons=geo.features.filter(f=>f.properties?.plot==="14-VSD").flatMap(f=>
 f.geometry.type==="MultiPolygon"?f.geometry.coordinates:f.geometry.type==="Polygon"?[f.geometry.coordinates]:[]);
function outline(bounds){
 if(!bounds)return"";
 const sw=bounds[0],ne=bounds[1];if(!sw||!ne)return"";
 const dx=ne[1]-sw[1],dy=ne[0]-sw[0];if(!dx||!dy)return"";
 const paths=polygons.flatMap(p=>p.map(ring=>ring.map(([lon,lat])=>
  ((lon-sw[1])/dx*1000).toFixed(2)+","+((ne[0]-lat)/dy*1000).toFixed(2)).join(" ")));
 return '<svg class="sat-overlay" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true">'+
 paths.map(p=>'<polygon points="'+p+'"/>').join("")+'</svg>';
}
function image(date,mode,cls=""){
 const l=getLayer(date,mode);
 if(!l)return '<div class="image-view '+cls+'"><span class="missing">ไม่มีภาพดาวเทียมจริงสำหรับ '+esc(mode)+'</span></div>';
 return '<div class="image-view '+cls+'"><img src="'+l.src+'" alt="'+esc(mode+" "+date)+'">'+outline(l.bounds)+'</div>';
}
const a=ok(early)?early.water_rai:null,b=ok(late)?late.water_rai:null;
const diff=a!=null&&b!=null?b-a:null;
const records=plotsData.plots.map(p=>{
 const h=hist.plots[p.plot]||[];
 const current=h.find(r=>r.date==="2026-09-29");
 const original=h.find(r=>r.role==="baseline")||h.find(r=>ok(r)&&r.date!=="2026-09-29");
 const valid=ok(original)&&ok(current);
 const base=ok(original)?original.water_rai:null;
 const now=ok(current)?current.water_rai:null;
 const delta=valid?Number(now)-Number(base):null;
 const gradeDraft=grade(p.plot);
 const noMeasurement=!valid;
 // Water-level screening uses only QA-qualified date-B water, independent of randomized B/C grade.
 const waterMeasured=ok(current)&&current?.water_rai!=null&&Number.isFinite(Number(current.water_rai))&&Number(p.area_rai)>0;
 const waterShare=waterMeasured?100*Number(current.water_rai)/Number(p.area_rai):null;
 const waterLevel=waterShare==null?"ประเมินไม่ได้":waterShare>=70?"มาก":waterShare>=30?"กลาง":"น้อย";
 const note=noMeasurement?(quality(current)==="NO_DATA"?"รอบติดตาม 29/09 ไม่มีข้อมูลที่ใช้วิเคราะห์ได้ • ไม่คำนวณผลต่าง":"ข้อมูล A/B ไม่ผ่าน QA ครบ • รอภาพที่ใช้วิเคราะห์ได้"):
 (delta>0?"พบพื้นที่น้ำเพิ่มจากวันที่ฐาน; เกรด B/C เป็นการสุ่ม ไม่ใช่ข้อสรุปความเสียหาย":delta<0?"พื้นที่น้ำลดจากวันที่ฐาน; เกรด B/C เป็นการสุ่ม ไม่ใช่ข้อสรุปความเสียหาย":"พื้นที่น้ำไม่เปลี่ยนตามค่าที่มี; เกรด B/C เป็นการสุ่ม");
 return {p,original,current,valid,base,now,delta,gradeDraft,noMeasurement,note,waterShare,waterLevel};
});
if(records.length!==19)throw Error("Expected 19 plots; got "+records.length);
const valid=records.filter(x=>x.valid);
const missing=records.filter(x=>!x.valid);
const counts={B:records.filter(x=>x.gradeDraft==="B").length,C:records.filter(x=>x.gradeDraft==="C").length};
const waterGroups={high:records.filter(x=>x.waterLevel==="มาก").sort((a,b)=>b.waterShare-a.waterShare),
 medium:records.filter(x=>x.waterLevel==="กลาง"),
 low:records.filter(x=>x.waterLevel==="น้อย"),
 unknown:records.filter(x=>x.waterLevel==="ประเมินไม่ได้")};
const waterLabel=x=>'<span class="water-level '+(x.waterLevel==="มาก"?"high":x.waterLevel==="กลาง"?"medium":x.waterLevel==="น้อย"?"low":"unknown")+
 '" title="'+(x.waterShare==null?"ไม่พบค่าพื้นที่น้ำที่ผ่าน QA":n(x.waterShare,1)+"% ของพื้นที่แปลง")+'">'+esc(x.waterLevel)+'</span>';
const sumDelta=valid.reduce((t,x)=>t+x.delta,0);
const sumWater=records.filter(x=>ok(x.current)).reduce((t,x)=>t+x.now,0);
const area=records.reduce((t,x)=>t+Number(x.p.area_rai||0),0);
const imageCover=getLayer("2026-09-29","true_color");


const dateFirst="2026-08-03",dateNext="2026-09-29",dateLast="2026-10-07";
const percent=(p,rec)=>ok(rec)&&rec?.water_rai!=null&&Number(p.area_rai)>0?100*Number(rec.water_rai)/Number(p.area_rai):null;
const all=records.map((r,i)=>({...r,index:i+1,ratio:percent(r.p,r.current)}));
const cat=x=>x==null?"ประเมินไม่ได้":x>=70?"มาก":x>=30?"กลาง":"น้อย";
const summary={high:all.filter(r=>cat(r.ratio)==="มาก"),medium:all.filter(r=>cat(r.ratio)==="กลาง"),
 low:all.filter(r=>cat(r.ratio)==="น้อย"),unknown:all.filter(r=>cat(r.ratio)==="ประเมินไม่ได้")};
const prioritised=[...summary.high].sort((a,b)=>b.ratio-a.ratio).slice(0,5);
const badge=level=>'<span class="level '+(level==="มาก"?"high":level==="กลาง"?"medium":level==="น้อย"?"low":"unknown")+'">'+esc(level)+'</span>';
const kpi=(lab,val,unit,clr)=>'<div class="kpi '+clr+'"><small>'+lab+'</small><strong>'+val+'</strong><span>'+unit+'</span></div>';
const tiles=[["True Color 4-3-2",dateFirst,"true_color"],["False Color 8-4-3",dateFirst,"false_color"],
 ["MNDWI · A",dateFirst,"mndwi"],["MNDWI · B",dateNext,"mndwi"],["MNDWI · C",dateLast,"mndwi"]];
// Verified PDD boundary is a vector overlay in the report, not a change to the original satellite bytes.
// Natural-sized SVG viewBox + preserveAspectRatio="xMidYMid meet" aligns with img object-fit: contain.
function exactPddOverlay(layer){
 if(!layer?.bounds||!layer?.width||!layer?.height||!polygons.length)return"";
 const sw=layer.bounds[0],ne=layer.bounds[1];
 const dx=ne[1]-sw[1],dy=ne[0]-sw[0];
 if(!(dx>0&&dy>0))return"";
 const coords=polygons.flatMap(poly=>poly.map(ring=>ring.map(([lon,lat])=>
  (((lon-sw[1])/dx)*layer.width).toFixed(3)+","+(((ne[0]-lat)/dy)*layer.height).toFixed(3)
 ).join(" ")));
 const paths=coords.map(points=>'<polygon points="'+points+'"/>').join("");
 return '<svg class="pdd-overlay" data-source="boundaries.geojson" data-plot="14-VSD" '+
  'viewBox="0 0 '+layer.width+' '+layer.height+'" preserveAspectRatio="xMidYMid meet" '+
  'role="img" aria-label="เส้นขอบเขตแปลง PDD 14-VSD สีแดง">'+
  '<g class="pdd-halo">'+paths+'</g><g class="pdd-line">'+paths+'</g></svg>';
}
const scene=([lab,date,mode])=>{
 const l=getLayer(date,mode);
 return '<div class="scene"><div class="scene-label">'+esc(lab)+'<small>'+esc(thaiDate(date))+'</small></div>'+
 '<div class="scene-photo">'+(l?'<img src="'+l.src+'" alt="'+esc(lab+" "+date)+'" data-unaltered-source="full_preview_part_2.json" data-date="'+date+'" data-mode="'+mode+'" width="'+l.width+'" height="'+l.height+'"/>'+exactPddOverlay(l):
 '<div class="no-scene">ไม่มีภาพจริง</div>')+'</div>'+
 '<div class="scene-foot">'+(date===dateLast?"IMAGE ONLY • INDEX PENDING":"SENTINEL-2 • VERIFIED")+'</div></div>';
};
const headline='<header class="banner"><div><div class="super">RAYONG MANGROVE · SENTINEL-2 L2A · REAL SATELLITE EVIDENCE</div>'+
 '<h1>รายงานสรุปติดตามพื้นที่น้ำ จังหวัดระยอง</h1>'+
 '<p>อินโฟกราฟิกข้อมูลเดิม • แปลงภาพหลัก 14-VSD • ค่าประเมินที่ผ่าน QA</p></div>'+
 '<div class="corner">ONE PAGE<br><b>2026</b></div></header>';
const numbers='<div class="numbers">'+kpi("แปลงทั้งหมด","19","แปลง","green")+
 kpi("A/B ผ่าน QA",valid.length,"แปลง","mint")+kpi("ข้อมูลไม่ครบ",missing.length,"แปลง","grey")+

 kpi("น้ำ 03/08",n(early.water_rai),"ไร่","blue")+
 kpi("น้ำ 29/09",n(late.water_rai),"ไร่","blue")+

 '<div class="scenes">'+tiles.map(scene).join("")+'</div>'+

const insights='<div class="insights"><div class="insight"><h2>ข้อค้นพบสำคัญ</h2>'+

 '<p>07/10 มีภาพ MNDWI จริง แต่ไม่มีผลวิเคราะห์รายวันที่ยืนยันแล้ว</p>'+
 '<p>ระดับน้ำ/พื้นที่เป็นการคัดกรอง ไม่ใช่หลักฐานยืนยันความเสียหาย</p>'+
 '</div><div class="top"><div class="tophead"><b>แปลงที่ควรติดตามพิเศษ</b><small>น้ำเปิด/พื้นที่แปลง ณ 29/09</small></div>'+
 '<div class="topbody"><div class="bars">'+prioritised.map((x,i)=>
 '<div class="bar"><span>'+String(i+1)+'</span><b>'+esc(x.p.plot)+'</b>'+
 '<div class="track"><i style="width:'+Math.min(x.ratio,100)+'%"></i></div><strong>'+n(x.ratio,2)+'%</strong></div>').join("")+'</div>'+
 '<div class="catcount">'+
 '<div class="high">มาก <b>'+summary.high.length+'</b></div>'+
 '<div class="medium">กลาง <b>'+summary.medium.length+'</b></div>'+
 '<div class="low">น้อย <b>'+summary.low.length+'</b></div>'+

 '</div></div></div></div>';

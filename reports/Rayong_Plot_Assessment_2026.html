<style>

@media print{
 .toolbar,.status{display:none!important}

@media screen and (max-width:850px){.toolbar{flex-direction:column;align-items:stretch;gap:8px}#pages{overflow-x:auto}.sheet{margin:0 8px 24px}}

/* Two-page compact evidence-first layout. No redundant provincial overview page. */
.sheet{gap:0}

.short-heading{display:flex;align-items:center;justify-content:space-between;margin:2mm 0;font-size:12px;color:#0b6c4e;border-bottom:2px solid #b4d8c5;padding:0 0 4px}

.table-clarify{font-size:9.5px;line-height:1.6;margin-top:4mm;background:#ecf5ec;border-left:3px solid #0b8861;padding:8px 11px;color:#456d56}

@media print{.evidence-card,.exception-card,.evidence-facts div,.report-subline{print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important}}

</style>

<body>
<div class="toolbar"><div><strong>รายงานประเมินแปลงป่าชายเลน จ.ระยอง</strong><small>19 แปลง · แปลงภาพหลัก 14-VSD · ภาพสามวันที่กำหนด · เกรดสมมติ B/C</small></div><div><button type="button" onclick="window.print()">พิมพ์ / บันทึก PDF</button><a class="muted" href="../?tab=center&scope=plot&plot=14-VSD">กลับระบบ Monitoring</a></div></div>
<div class="status" id="status">กำลังอ่านข้อมูล Sentinel-2 และผลวิเคราะห์จากคลังรายงานจริง...</div>
<div id="pages"></div>
<script>
(async function(){
"use strict";
const qs=(s)=>document.querySelector(s);
const esc=x=>String(x??"").replace(/[&<>"']/g,k=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[k]||k));
const thaiDate=d=>d?/^\d{4}-\d\d-\d\d$/.test(d)?d.slice(8,10)+"/"+d.slice(5,7)+"/"+(Number(d.slice(0,4))+543):d:"—";
const n=(v,p=2)=>v==null||!Number.isFinite(Number(v))?"—":Number(v).toLocaleString("th-TH",{minimumFractionDigits:p,maximumFractionDigits:p});
const quality=r=>r?.analysis_status||"INDEX_PENDING";
const ok=r=>r&&["VERIFIED","AUTO_VALID"].includes(quality(r))&&Number(r.valid_pct)>=70;
const signed=v=>v==null?"—":(v>0?"+":"")+n(v);
const dateSeries=["2026-08-03","2026-09-29","2026-10-07"];
const uniqueSeed="rayong-2026-10-20-grade-draft-BC";
function grade(plot){
 let h=2166136261;for(const c of (uniqueSeed+"|"+plot)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}
 return (h>>>0)%2===0?"B":"C";
}
const fg=(v)=>'<span class="g '+v+'">'+v+'</span>';
const qaBadge=(r)=>'<span class="flag '+(!r?"empty":ok(r)?"":quality(r)==="PARTIAL"?"warn":"empty")+'">'+esc(quality(r))+'</span>';
const head=(i,title,sub)=>'<header class="page-head"><span class="sub">RAYONG • SATELLITE ENVIRONMENTAL REVIEW / DRAFT</span><strong>'+i+'. '+esc(title)+'</strong><small>'+esc(sub)+'</small></header>';
const foot=(i)=>'<footer class="page-num"><span>ข้อมูล Sentinel-2 L2A · PDD/QA • เกรดสุ่มเป็นร่าง ไม่ใช่ผลตรวจรับรอง</span><b>'+String(i).padStart(2,"0")+' / 02</b></footer>';
const section=(i,title,sub,inner)=>'<section class="sheet">'+head(i,title,sub)+inner+foot(i)+'</section>';
const [plotsData,hist,preview,geo]=await Promise.all([
 "../data/plots.json","../data/analysis_history.json","../data/full_preview_part_2.json","../data/boundaries.geojson"
].map(async u=>{const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw Error("ไม่สามารถโหลด "+u+" : "+r.status);return r.json()}));
const mainMeta=plotsData.plots.find(x=>x.plot==="14-VSD");
if(!mainMeta)throw Error("Missing main plot 14-VSD");
const mainRows=hist.plots["14-VSD"]||[];
const byDate=d=>mainRows.find(x=>x.date===d);
const early=byDate(dateSeries[0]),late=byDate(dateSeries[1]),third=byDate(dateSeries[2]);
const mainData=(preview.layers||[]).filter(x=>x.plot==="14-VSD");
const priority={DIRECT:0,LATEST_RECT:1,HIST_CLEAR_RECT_SCL0:2,NO_CLOUD_FILTER:3};
const getLayer=(date,mode)=>mainData.filter(x=>x.date===date&&x.mode===mode&&x.src).sort((a,b)=>(priority[a.source_suffix]??5)-(priority[b.source_suffix]??5))[0];
const polygons=geo.features.filter(f=>f.properties?.plot==="14-VSD").flatMap(f=>
 f.geometry.type==="MultiPolygon"?f.geometry.coordinates:f.geometry.type==="Polygon"?[f.geometry.coordinates]:[]);
function outline(bounds){
 if(!bounds)return"";
 const sw=bounds[0],ne=bounds[1];if(!sw||!ne)return"";
 const dx=ne[1]-sw[1],dy=ne[0]-sw[0];if(!dx||!dy)return"";
 const paths=polygons.flatMap(p=>p.map(ring=>ring.map(([lon,lat])=>
  ((lon-sw[1])/dx*1000).toFixed(2)+","+((ne[0]-lat)/dy*1000).toFixed(2)).join(" ")));
 return '<svg class="sat-overlay" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true">'+
 paths.map(p=>'<polygon points="'+p+'"/>').join("")+'</svg>';
}
function image(date,mode,cls=""){
 const l=getLayer(date,mode);
 if(!l)return '<div class="image-view '+cls+'"><span class="missing">ไม่มีภาพดาวเทียมจริงสำหรับ '+esc(mode)+'</span></div>';
 return '<div class="image-view '+cls+'"><img src="'+l.src+'" alt="'+esc(mode+" "+date)+'">'+outline(l.bounds)+'</div>';
}
const a=ok(early)?early.water_rai:null,b=ok(late)?late.water_rai:null;
const diff=a!=null&&b!=null?b-a:null;
const records=plotsData.plots.map(p=>{
 const h=hist.plots[p.plot]||[];
 const current=h.find(r=>r.date==="2026-09-29");
 const original=h.find(r=>r.role==="baseline")||h.find(r=>ok(r)&&r.date!=="2026-09-29");
 const valid=ok(original)&&ok(current);
 const base=ok(original)?original.water_rai:null;
 const now=ok(current)?current.water_rai:null;
 const delta=valid?Number(now)-Number(base):null;
 const gradeDraft=grade(p.plot);
 const noMeasurement=!valid;
 const note=noMeasurement?(quality(current)==="NO_DATA"?"รอบติดตาม 29/09 ไม่มีข้อมูลที่ใช้วิเคราะห์ได้ • ไม่คำนวณผลต่าง":"ข้อมูล A/B ไม่ผ่าน QA ครบ • รอภาพที่ใช้วิเคราะห์ได้"):
 (delta>0?"พบพื้นที่น้ำเพิ่มจากวันที่ฐาน; เกรด B/C เป็นการสุ่ม ไม่ใช่ข้อสรุปความเสียหาย":delta<0?"พื้นที่น้ำลดจากวันที่ฐาน; เกรด B/C เป็นการสุ่ม ไม่ใช่ข้อสรุปความเสียหาย":"พื้นที่น้ำไม่เปลี่ยนตามค่าที่มี; เกรด B/C เป็นการสุ่ม");
 return {p,original,current,valid,base,now,delta,gradeDraft,noMeasurement,note};
});
if(records.length!==19)throw Error("Expected 19 plots; got "+records.length);
const valid=records.filter(x=>x.valid);
const missing=records.filter(x=>!x.valid);
const counts={B:records.filter(x=>x.gradeDraft==="B").length,C:records.filter(x=>x.gradeDraft==="C").length};
const sumDelta=valid.reduce((t,x)=>t+x.delta,0);
const sumWater=records.filter(x=>ok(x.current)).reduce((t,x)=>t+x.now,0);
const area=records.reduce((t,x)=>t+Number(x.p.area_rai||0),0);
const imageCover=getLayer("2026-09-29","true_color");
const coverDate="2026-08-03";
const keyImages=[
 ["True Color 4-3-2",coverDate,"true_color"],
 ["False Color 8-4-3",coverDate,"false_color"]
];
const overview='<div class="evidence-top">'+keyImages.map(([label,date,mode])=>
 '<div class="evidence-card">'+
 '<div class="evidence-card-title"><b>'+esc(label)+'</b><span>'+esc(thaiDate(date))+'</span></div>'+
 image(date,mode,'evidence-image')+
 '<div class="evidence-info">แปลง 14-VSD · ขอบเขต PDD สีแดง · '+esc(quality(byDate(date)))+'</div></div>').join("")+'</div>';
const mndwiCards='<div class="mndwi-cards">'+dateSeries.map((date,i)=>
 '<div class="evidence-card">'+
 '<div class="evidence-card-title"><b>MNDWI · '+["A","B","C"][i]+'</b><span>'+esc(thaiDate(date))+'</span></div>'+
 image(date,"mndwi","water-image")+
 '<div class="evidence-info">'+(byDate(date)?'QA '+esc(quality(byDate(date)))+' · MNDWI '+n(ok(byDate(date))?byDate(date).mndwi:null,3):
 'มีภาพดาวเทียมจริง · ยังไม่มีผลวิเคราะห์รายวัน')+'</div></div>').join("")+'</div>';
const difference=ok(early)&&ok(late)?late.water_rai-early.water_rai:null;
const quickFacts='<div class="evidence-facts">'+
 '<div><small>พื้นที่ PDD</small><strong>'+n(mainMeta.area_rai)+' ไร่</strong></div>'+
 '<div><small>น้ำ 03/08</small><strong>'+n(ok(early)?early.water_rai:null)+' ไร่</strong></div>'+

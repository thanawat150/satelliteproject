<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>รายงานระยอง — แนวนอนหน้าเดียว (A3 / A4)</title>
<style>
@page{size:A4 portrait;margin:0}
*{box-sizing:border-box}
:root{font-family:"Noto Sans Thai","Tahoma",sans-serif;color:#183c32;background:#102a35}
body{margin:0}
.toolbar{position:sticky;top:0;z-index:100;background:#103744;color:#eafff5;display:flex;gap:15px;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:2px solid #117b60;box-shadow:0 8px 30px #0005}
.toolbar strong{font-size:15px}.toolbar small{font-size:11px;color:#bad4cd;display:block}
.toolbar button,.toolbar a{padding:9px 14px;border-radius:8px;color:#fff;background:#0b8567;border:1px solid #40b38f;font:700 12px "Noto Sans Thai",sans-serif;text-decoration:none;cursor:pointer}
.toolbar button:hover{background:#0a9e77}
.toolbar .muted{background:#184452}
.status{padding:12px;background:#f1f6ed;border-left:4px solid #15885c;color:#376348;margin:14px auto;max-width:210mm;font-size:12px}
#pages{padding:15px 0 45px}
.sheet{width:210mm;height:297mm;min-height:297mm;max-height:297mm;overflow:hidden;margin:0 auto 24px;background:#fafcf8;position:relative;box-shadow:0 12px 35px #0007;display:flex;flex-direction:column;padding:8mm 9mm 7mm;break-after:page;page-break-after:always;isolation:isolate}
.sheet::before{content:"";position:absolute;inset:0;background:linear-gradient(150deg,rgba(225,241,228,.2),transparent);z-index:-1}
.sheet>*{position:relative}
.lead{padding:0}
.hero{height:105mm;background:linear-gradient(120deg,#064d37,#147f66);color:white;overflow:hidden;position:relative;padding:11mm 11mm 8mm;display:flex;flex-direction:column;justify-content:space-between}
.hero .background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.7;filter:saturate(1.15) contrast(1.05)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(0,52,35,.94),rgba(0,59,45,.74) 50%,rgba(8,74,62,.23));z-index:0}
.hero>*:not(.background){z-index:1}
.eyebrow{font:800 10px Arial,sans-serif;letter-spacing:.16em;color:#bdf1d4}
.hero h1{font-size:29px;line-height:1.37;margin:7mm 0 3mm;color:#fff}
.hero .intro{font-size:14px;color:#d9f5e5;line-height:1.5}
.hero-tags{display:flex;gap:6px;flex-wrap:wrap}
.hero-tags span{border:1px solid #adf6c690;border-radius:5px;background:#00462b99;padding:5px 9px;font-size:10px}
.lead-content{padding:7mm 9mm;display:flex;flex-direction:column;gap:4mm;flex:1;min-height:0}
.warning{background:#fff5e4;color:#885722;border-left:4px solid #d99a31;border-radius:4px;padding:8px 11px;font-size:10.8px;font-weight:700;line-height:1.5}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:2mm}
.kpi{border:1px solid #c6e1d1;background:#e8f5e9;border-radius:5px;min-height:23mm;padding:3mm}
.kpi small{font-size:9px;color:#4f7863;display:block}.kpi strong{display:block;font:800 18px Arial,"Noto Sans Thai",sans-serif;margin:2.5mm 0 0;color:#07664b}.kpi em{font-size:8px;font-style:normal;color:#648473}
.section-header{border-bottom:2px solid #1f936f;display:flex;gap:10px;align-items:center;padding-bottom:4px;margin:1mm 0 3mm}
.section-header .no{font:800 18px Arial,sans-serif;color:#07865d}
.section-header b{font-size:14px;color:#085e49}
.section-header small{margin-left:auto;color:#6f8a78;font-size:8px}
.cover-main{display:grid;grid-template-columns:40% 1fr;gap:4mm;align-items:stretch}
.cover-img{height:44mm;position:relative;background:#dbe4dc;border-radius:6px;overflow:hidden;border:1px solid #bad9c5}
.cover-img img{width:100%;height:100%;object-fit:fill;display:block;image-rendering:auto}
.sat-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;fill:none;stroke:#ff493f;stroke-width:6;vector-effect:non-scaling-stroke}
.cover-copy{font-size:11px;line-height:1.7;color:#37644f}
.cover-copy b{color:#08664c}
.chart{display:flex;gap:13px;align-items:flex-end;justify-content:center;border:1px solid #d6e8da;border-radius:7px;padding:11px 13px;min-height:30mm;background:#f4faf5}
.baritem{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;flex:1;max-width:68px;font-size:9px}
.baritem strong{font-size:10px;color:#1d654d}
.barpanel{height:21mm;width:39px;background:#e0eae4;display:flex;align-items:flex-end;border-radius:5px;overflow:hidden}
.barpanel i{display:block;width:100%;background:linear-gradient(#39bac2,#13818e);min-height:1px}
.legend-bottom{font-size:10px;color:#587769;line-height:1.4}
.page-head{background:#075941;color:white;min-height:31mm;padding:5mm 7mm;border-radius:6px;margin-bottom:5mm;display:flex;flex-direction:column;gap:3mm;overflow:hidden}
.page-head strong{font-size:19px;line-height:1.4}.page-head small{font-size:10px;color:#d0f2df}
.page-head .sub{font:800 9px Arial,sans-serif;letter-spacing:.12em;color:#b4f7d6}
.page-num{margin-top:auto;padding-top:3mm;border-top:1px solid #bad9c7;display:flex;justify-content:space-between;font-size:9px;color:#6a8b7a}
.page-num b{color:#0c7655}
.image-matrix{display:grid;grid-template-columns:23mm repeat(3,1fr);grid-template-rows:9mm repeat(3,63mm);gap:2.7mm;flex:1;min-height:0}
.column-head{background:#e2f1e6;border-radius:5px;color:#0b674d;text-align:center;padding:3px;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center}
.row-head{background:#0c7254;color:#fff;border-radius:5px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.row-head b{font-size:10px}.row-head span{font-size:8px;line-height:1.35}
.image-cell{border:1px solid #bfdac7;border-radius:5px;padding:5px;min-width:0;background:white;display:flex;flex-direction:column;gap:6px}
.image-view{position:relative;background:#e2ede7;flex:1;max-height:53mm;min-height:0;border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.image-view img{width:100%;height:100%;object-fit:fill;display:block}
.image-view svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;fill:none;stroke:#ff4945;stroke-width:5}
.image-view .missing{font-size:10px;padding:8px;color:#71867b;text-align:center}
.cell-footer{display:flex;justify-content:space-between;align-items:center;font-size:8px;color:#436c58;gap:3px}
.flag{background:#d9efe2;color:#08724c;font:800 7.5px Arial,sans-serif;border-radius:4px;padding:3px 5px}
.flag.warn{background:#fff0ce;color:#a26a16}
.flag.empty{background:#f0e6e5;color:#9b4d42}
.image-note{font-size:9px;line-height:1.5;color:#567365;margin-top:3mm;background:#edf6f0;border-radius:5px;padding:8px}
.mega-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:2.5mm;margin:1mm 0 4mm}
.mega-summary div{background:#e8f3eb;border:1px solid #d2e8d9;border-radius:4px;padding:3mm;min-height:19mm}
.mega-summary span{font-size:9px;color:#618373;display:block}
.mega-summary strong{font:800 17px Arial,"Noto Sans Thai";color:#0c674e}
table{border-collapse:collapse;width:100%;table-layout:fixed}
th,td{padding:7px 5px;border-bottom:1px solid #dce9df;text-align:center;font-size:9.1px}
th{background:#deefe4;color:#0c674b;font-weight:800;font-size:9px}
td{color:#385f4b} td:first-child,th:first-child{text-align:left}
tbody tr:nth-child(2n){background:#f4f9f5}
tbody tr.missing-row{background:#fff6e9}
.g{display:inline-flex;align-items:center;justify-content:center;border-radius:5px;min-width:19px;height:19px;color:white;font:800 12px Arial,sans-serif}
.g.B{background:#168464}.g.C{background:#cb8534}
.tnote{font-size:9px;line-height:1.45;color:#496d57;margin-top:4mm}
.analysis-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:3mm;flex:1;min-height:0}
.acard{border:1px solid #d3e4d9;background:#fff;border-radius:6px;padding:9px 11px;display:flex;flex-direction:column;gap:5px}
.acard-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d6e6dc;padding-bottom:3px}
.acard-head b{font-size:11px;color:#0b6249}
.acard-head .g{width:19px;height:19px;font-size:10px}
.acard .meters{display:flex;gap:10px;flex-wrap:wrap;font:700 9px Arial,"Noto Sans Thai",sans-serif;color:#39715c}
.acard p{font-size:9px;line-height:1.48;color:#5f7767;margin:0}
.methods{background:#eaf4ed;border-left:3px solid #129568;border-radius:5px;padding:10px 14px;font-size:9.4px;line-height:1.65;margin:3mm 0}
.methods b{color:#0b6049}
#load-note{display:none}
@media print{
 .toolbar,.status{display:none!important}
 body{background:white!important}
 #pages{padding:0!important}
 .sheet{margin:0!important;box-shadow:none!important;break-after:page;page-break-after:always}
 .sheet:last-child{break-after:auto!important;page-break-after:auto!important}
 .hero,.page-head,.warning,.kpi,.flag,.row-head,.chart,.barpanel,.g{print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important}
}
@media screen and (max-width:850px){.toolbar{flex-direction:column;align-items:stretch;gap:8px}#pages{overflow-x:auto}.sheet{margin:0 8px 24px}}

/* Two-page compact evidence-first layout. No redundant provincial overview page. */
.sheet{gap:0}
.page-head{margin-bottom:3.5mm;min-height:29mm}
.warning{margin:0 0 3mm;padding:6px 9px;font-size:10px}
.short-heading{display:flex;align-items:center;justify-content:space-between;margin:2mm 0;font-size:12px;color:#0b6c4e;border-bottom:2px solid #b4d8c5;padding:0 0 4px}
.short-heading strong{font-weight:800}.short-heading span{font-size:9px;color:#638775;font-weight:700}
.evidence-top{display:grid;grid-template-columns:1fr 1fr;gap:3mm;height:76mm;flex-shrink:0}
.evidence-card{display:flex;flex-direction:column;border:1px solid #c9ddce;border-radius:6px;padding:7px;min-width:0;background:white;overflow:hidden}
.evidence-card-title{font-size:11px;display:flex;justify-content:space-between;gap:5px;align-items:center;color:#12694e;margin-bottom:5px}
.evidence-card-title span{font-size:9px;color:#557968}
.evidence-image{flex:1;min-height:0;max-height:64mm!important}
.evidence-image img,.water-image img{height:100%;width:100%;object-fit:fill}
.evidence-info{font-size:8.7px;color:#5c7768;line-height:1.25;padding-top:5px}
.mndwi-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2mm;height:62mm;flex-shrink:0}
.water-image{flex:1;min-height:0;max-height:50mm!important}
.evidence-facts{display:grid;grid-template-columns:repeat(4,1fr);gap:2mm;margin:4mm 0 2mm}
.evidence-facts div{background:#e3f2e7;border:1px solid #c6e4d0;border-radius:5px;padding:2.7mm 2.3mm;min-height:16mm}
.evidence-facts small{font-size:8.5px;color:#608571;display:block}
.evidence-facts strong{font-size:15px;color:#08654b;font-weight:800;display:block;margin-top:1mm}
.plot-note{font-size:10px;line-height:1.55;background:#eef5ed;color:#426a56;padding:3mm;border-radius:5px}
.report-subline{display:flex;justify-content:space-between;background:#e2f2e9;border:1px solid #c2e2cf;border-radius:6px;padding:9px 12px;margin:0 0 4mm}
.report-subline span{font-size:9.5px;font-weight:800;color:#0c684f}
.plot-table{margin:0 0 4mm}
.plot-table th{font-size:9.2px;padding:8px 5px}
.plot-table td{font-size:9.3px;padding:8.5px 5px}
.exception-grid{display:grid;grid-template-columns:1fr 1fr;gap:3mm}
.exception-card{display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:start;border:1px solid #eed5b0;background:#fff8eb;border-radius:5px;padding:8px 10px}
.exception-card b{font-size:10px;color:#805821}
.exception-card span{font-size:9px;color:#a16f32;text-align:right}
.exception-card p{grid-column:1/-1;font-size:9px;color:#816743;margin:4px 0 0;line-height:1.5}
.table-clarify{font-size:9.5px;line-height:1.6;margin-top:4mm;background:#ecf5ec;border-left:3px solid #0b8861;padding:8px 11px;color:#456d56}
.table-clarify b{color:#a36c29}
@media print{.evidence-card,.exception-card,.evidence-facts div,.report-subline{print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important}}


/* A3 native one-page poster, optionally scaled precisely to A4 landscape. */
@page{size:A3 landscape;margin:0}
body{background:#0d2a34}
#pages{width:420mm;height:297mm;margin:0 auto;padding:0;overflow:hidden;position:relative}
.sheet.landscape-sheet{width:420mm;height:297mm;min-height:297mm;max-height:297mm;overflow:hidden;position:relative;margin:0;background:#fbfdf9;padding:5mm 6mm 4mm;display:flex;flex-direction:column;gap:2mm;box-shadow:none;break-after:auto;page-break-after:auto}
.landscape-header{height:35mm;flex-shrink:0;position:relative;isolation:isolate;border-radius:2mm;background:#09563f;color:white;overflow:hidden;padding:5mm 8mm;display:flex;align-items:center;justify-content:space-between;gap:5mm}
.hero-sat{position:absolute;inset:0;object-fit:cover;width:100%;height:100%;opacity:.7;z-index:-2}
.landscape-header::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#06442edc,#0b574bcb 57%,#0b5648a8);z-index:-1}
.hero-head small{font-size:9px;letter-spacing:.12em;color:#caf4df;font-weight:800}
.hero-head h1{font-size:23px;line-height:1.5;margin:1mm 0;color:white}
.hero-head p{font-size:11px;color:#e0f4e6}
.hero-stat{text-align:right;white-space:nowrap}
.hero-stat span,.hero-stat small{display:block;font-size:9px;color:#b7f0d0}
.hero-stat b{display:block;font-size:20px;color:white}
.draft-stamp{height:10mm;display:flex;align-items:center;flex-shrink:0;padding:2mm 3mm;background:#fff5e4;border-left:3px solid #c79439;color:#8c6122;font-weight:800;font-size:10px}
.landscape-columns{display:grid;grid-template-columns:43fr 57fr;gap:5mm;flex:1;min-height:0;overflow:hidden}
.evidence-column,.table-column{display:flex;flex-direction:column;min-width:0;min-height:0;gap:2mm}
.landscape-columns h2{font-size:13px;color:#08674c;border-bottom:1.5px solid #bedec8;padding:2mm 0 1.5mm;margin:0;display:flex;align-items:center;gap:2mm}
.landscape-columns h2 span{background:#0b7b57;color:white;padding:.5mm 2mm;border-radius:1mm;font:800 12px Arial,sans-serif}
.hint{font-size:9.5px;color:#6a8774;line-height:1.4;margin:0 0 1mm}
.rgb-pair{display:grid;grid-template-columns:1fr 1fr;gap:2mm;height:90mm;flex-shrink:0}
.evidence-block{border:1px solid #cbdfd0;background:white;border-radius:2mm;min-width:0;min-height:0;overflow:hidden;padding:2mm;display:flex;flex-direction:column;gap:1mm}
.ev-title{font-size:10px;color:#096448;display:flex;justify-content:space-between;gap:1mm;align-items:center}
.ev-title span{color:#708b77;font-size:8px}
.evidence-block .image-view{flex:1;min-height:0;max-height:none;width:100%;overflow:hidden}
.evidence-block .image-view img{width:100%;height:100%;object-fit:fill}
.ev-meta{display:flex;justify-content:space-between;align-items:center;font-size:8px;color:#52705d}
.qa{font-size:7px;padding:2px 4px;border-radius:2px;font-weight:800;background:#f3e8cd;color:#966c25}
.qa.verified{background:#e1f3e9;color:#0b7656}
.water-heading{margin-top:1mm!important}
.water-triple{display:grid;grid-template-columns:repeat(3,1fr);gap:2mm;height:78mm;flex-shrink:0}
.water-qa{display:grid;grid-template-columns:repeat(3,1fr);gap:2mm;margin-top:1mm}
.water-qa div{background:#e5f3e9;border:1px solid #cbe4d5;border-radius:1.5mm;padding:2mm;display:flex;flex-direction:column;gap:1mm}
.water-qa strong{font-size:8px;color:#587b64}
.water-qa b{font-size:13px;color:#075d44}
.evidence-warning{font-size:9px;line-height:1.55;background:#f1f7ef;color:#4b6a57;border-left:2px solid #228966;padding:2mm 3mm;margin:1mm 0}
.grade-summary{display:flex;justify-content:space-between;gap:2mm}
.grade-summary span{background:#e6f3e9;border:1px solid #c8e1ce;border-radius:1.5mm;padding:2mm 2.5mm;font-size:9px;color:#3d6a4f;flex:1;text-align:center}
.grade-summary b{color:#09634c;font-size:13px;margin-left:1mm}
.landscape-table{width:100%;table-layout:fixed;border-collapse:collapse}
.landscape-table th{font-size:8.3px;line-height:1.1;background:#dceddf;color:#105b46;padding:2mm .9mm}
.landscape-table td{font-size:8.5px;color:#385b49;padding:2.1mm .9mm;line-height:1.1}
.landscape-table tr:nth-child(2n) td{background:#f4f9f4}
.landscape-table th:nth-child(1){width:17%}
.landscape-table th:nth-child(2){width:13%}
.landscape-table th:nth-child(3){width:14%}
.landscape-table th:nth-child(4){width:10%}
.landscape-table th:nth-child(5){width:10%}
.landscape-table th:nth-child(6){width:12%}
.landscape-table th:nth-child(7){width:16%}
.landscape-table th:nth-child(8){width:8%}
.landscape-table .g{height:16px;min-width:16px;font-size:10px}
.landscape-table .qa-no{font-weight:800;color:#a06b34}
.landscape-table .missing-row td{background:#fff7ea!important}
.exception-heading{margin-top:2mm!important}
.exception-list{display:grid;grid-template-columns:1fr 1fr;gap:2mm}
.exception{border:1px solid #eddaa8;border-radius:1.5mm;background:#fff8ea;padding:2mm 2.5mm;display:flex;flex-direction:column;gap:1.5mm}
.exception strong{font-size:10px;color:#80571c}
.exception span{font-size:9px;color:#7f6741;line-height:1.4}
.method-note{font-size:8.6px;color:#55745d;line-height:1.45;margin:1mm 0 0}
.landscape-footer{height:8mm;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #bcd7c5;color:#557b65;gap:2mm}
.landscape-footer span{font-size:9px}
.landscape-footer strong{font:800 9px Arial,sans-serif;color:#0d7456;white-space:nowrap}
body.paper-a4 #pages{width:297mm;height:210mm;position:relative;overflow:hidden}
body.paper-a4 .sheet.landscape-sheet{position:absolute;left:0;top:0;transform:scale(0.7071428571428572);transform-origin:top left;break-after:auto!important}
body.paper-a4 .toolbar:after{content:"A4 — Reduced preview";font-size:9px;color:#8cdfbe}
@media print{
 body{background:white}
 #pages{padding:0!important;margin:0!important}
 .sheet.landscape-sheet{page-break-after:auto!important;break-after:auto!important}
 .landscape-header,.draft-stamp,.landscape-columns h2,.grade-summary,.water-qa,.exception-list,.evidence-block{print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important}
}

.landscape-table th:nth-child(3){width:13%}

.priority-title{display:flex;justify-content:space-between;align-items:center;gap:2mm}
.priority-title strong{font-size:10px;color:#a74e26}
.priority-title span{font-size:8px;font-weight:800;color:#ad683a}
.priority-top{display:flex;flex-wrap:wrap;gap:2mm}
.priority-top span{background:white;border:1px solid #e9d2b7;border-radius:1mm;padding:1mm 2mm;font-size:8px;font-weight:700}

.method-note{font-size:8.15px}

 .priority-summary,.water-level{print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important}

(function(){const paper=new URLSearchParams(location.search).get("paper")==="A4"?"A4":"A3";if(paper==="A4"){document.body.classList.add("paper-a4");const style=document.createElement("style");style.textContent="@page{size:A4 landscape;margin:0}";document.head.append(style)} })();

 if(!bounds)return"";

 paths.map(p=>'<polygon points="'+p+'"/>').join("")+'</svg>';
}

 const waterMeasured=ok(current)&&current?.water_rai!=null&&Number.isFinite(Number(current.water_rai))&&Number(p.area_rai)>0;
 const waterShare=waterMeasured?100*Number(current.water_rai)/Number(p.area_rai):null;

 return {p,original,current,valid,base,now,delta,gradeDraft,noMeasurement,note,waterShare,waterLevel};
});

const counts={B:records.filter(x=>x.gradeDraft==="B").length,C:records.filter(x=>x.gradeDraft==="C").length};

 unknown:records.filter(x=>x.waterLevel==="ประเมินไม่ได้")};

 '" title="'+(x.waterShare==null?"ไม่พบค่าพื้นที่น้ำที่ผ่าน QA":n(x.waterShare,1)+"% ของพื้นที่แปลง")+'">'+esc(x.waterLevel)+'</span>';

const sumWater=records.filter(x=>ok(x.current)).reduce((t,x)=>t+x.now,0);
const area=records.reduce((t,x)=>t+Number(x.p.area_rai||0),0);
const imageCover=getLayer("2026-09-29","true_color");

 return '<section class="evidence-block '+cls+'"><div class="ev-title"><strong>'+esc(title)+'</strong><span>'+esc(small)+'</span></div>'+

 '<td>'+esc(x.delta==null?"—":signed(x.delta))+'</td>'+
 '<td class="'+(x.noMeasurement?"qa-no":"")+'">'+esc(quality(x.current))+'</td>'+
 '<td>'+waterLabel(x)+'</td>'+
 '<td>'+fg(x.gradeDraft)+'</td></tr>').join("");
const table='<table class="landscape-table"><thead><tr>'+
 '<th>แปลง</th><th>พื้นที่ (ไร่)</th><th>วันฐาน</th><th>น้ำ A</th>'+
 '<th>น้ำ B</th><th>Δ น้ำ</th><th>QA</th><th>ระดับน้ำ/พื้นที่</th><th>เกรด*</th>'+
 '</tr></thead><tbody>'+rowTable+'</tbody></table>';
const highTop=waterGroups.high.slice(0,5);

 '<div class="priority-top">'+highTop.map(x=>'<span>'+esc(x.p.plot)+' <b>'+n(x.waterShare,1)+'%</b></span>').join("")+'</div>'+

 '<div class="hero-stat"><span>พื้นที่ PDD</span><b>'+n(records.reduce((z,x)=>z+Number(x.p.area_rai||0),0))+' ไร่</b>'+

 '<div class="landscape-columns">'+
 '<section class="evidence-column"><h2><span>01</span> หลักฐานภาพดาวเทียม · 14-VSD</h2>'+
 '<p class="hint">ภาพจริงและสีเท็จใช้เฉพาะวันที่ 03/08/2569 · เส้นสีแดงแสดงขอบเขต PDD</p>'+
 topImages+
 '<h2 class="water-heading"><span>02</span> ดัชนีน้ำ MNDWI สามช่วงเวลา</h2>'+

 '<section class="table-column"><h2><span>03</span> ผลวิเคราะห์พื้นที่น้ำและเกรด 19 แปลง</h2>'+
 '<div class="grade-summary"><span>เกรด B <b>'+counts.B+'</b></span><span>เกรด C <b>'+counts.C+'</b></span>'+
 '<span>น้ำมาก <b>'+waterGroups.high.length+'</b></span><span>ประเมินไม่ได้ <b>'+waterGroups.unknown.length+'</b></span></div>'+
 table+
 prioritySummary+

 '<p class="method-note">ระดับน้ำ/พื้นที่คำนวณจากน้ำ B (29/09) ÷ พื้นที่ PDD: มาก ≥70%, กลาง 30–<70%, น้อย <30%; หาก QA ไม่ผ่าน = ประเมินไม่ได้ · เป็นเกณฑ์คัดกรอง ไม่ใช่ความเสียหายจริงหรือเกรดสุ่ม B/C · Δ ใช้เฉพาะคู่วันที่ QA ผ่าน</p>'+
 '</section></div>'+
 '<footer class="landscape-footer"><span>แหล่งข้อมูล: Sentinel-2 L2A / PDD / ผลวิเคราะห์ QA จังหวัดระยอง · สร้างเพื่อทบทวนรูปแบบ</span>'+
 '<strong>ONE-PAGE DRAFT · '+(new URLSearchParams(location.search).get("paper")==="A4"?"A4":"A3")+' LANDSCAPE</strong></footer></section>';
qs("#pages").innerHTML=body;
qs("#status").textContent="พร้อมดูรายงานแนวนอนหน้าเดียว • 5 ภาพจริง (RGB 2 + MNDWI 3) • ตารางครบ 19 แปลง • หมายเหตุเฉพาะ 2 แปลง";
window.__REPORT_READY__={plot:"14-VSD",dates:dateSeries,plots:records.length,valid:valid.length,missing:missing.length,grades:counts,pages:1,
 imagery:{rgb:2,mndwi:3},levels:{high:waterGroups.high.length,medium:waterGroups.medium.length,low:waterGroups.low.length,unknown:waterGroups.unknown.length},format:new URLSearchParams(location.search).get("paper")==="A4"?"A4":"A3"};
const imgs=[...document.querySelectorAll(".sheet img")];
await Promise.all(imgs.map(im=>im.complete?Promise.resolve():new Promise(resolve=>{im.addEventListener("load",resolve,{once:true});im.addEventListener("error",resolve,{once:true});setTimeout(resolve,5000)})));
document.body.dataset.reportReady="true";
})().catch(e=>{document.querySelector("#status").textContent="เกิดข้อผิดพลาดในการสร้างรายงาน: "+e.message;document.body.dataset.reportError=e.message;console.error(e)});

<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Shopee Video Publisher — คลิป ตะกร้าสินค้า ปฏิทิน และผลลัพธ์สำหรับ Shopee Affiliate">
  <title>Shopee Video Publisher · Affiliate Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=1">
</head>
<body>
  <div class="workspace">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="?view=dashboard" data-view="dashboard" aria-label="Shopee Video Publisher หน้าแรก">
        <span class="brand-icon" aria-hidden="true">S<span>▶</span></span>
        <span class="brand-type"><strong>VIDEO <span>PUBLISHER</span></strong><small>POWERED BY AFFILIATE LAB</small></span>
      </a>
      <div class="sidebar-label">WORKSPACE</div>
      <nav class="nav" aria-label="เมนูหลัก">
        <button class="nav-link" data-view="dashboard"><span data-icon="layout-dashboard"></span> ภาพรวม</button>
        <button class="nav-link" data-view="library"><span data-icon="film"></span> คลังวิดีโอ</button>
        <button class="nav-link" data-view="compose"><span data-icon="square-pen"></span> เตรียมโพสต์</button>
        <button class="nav-link" data-view="calendar"><span data-icon="calendar-days"></span> ปฏิทินโพสต์</button>
        <button class="nav-link" data-view="performance"><span data-icon="chart-no-axes-column"></span> ผลลัพธ์</button>
      </nav>
      <div class="sidebar-grow"></div>
      <div class="sidebar-label">SYSTEM</div>
      <nav class="nav nav-utility">
        <button class="nav-link" data-action="backup"><span data-icon="download"></span> สำรองข้อมูล</button>
        <button class="nav-link" data-action="restore"><span data-icon="upload"></span> นำเข้าข้อมูล</button>
        <a class="nav-link" href="../ken-lab/?tab=home"><span data-icon="arrow-up-right"></span> กลับ Affiliate Lab</a>
      </nav>
      <div class="account">
        <span class="account-avatar">AL</span><span><strong>Private workspace</strong><small>Local-first · บนเครื่องนี้</small></span>
        <span class="account-dot" aria-hidden="true"></span>
      </div>
    </aside>
    <div class="main-shell">
      <header class="topbar">
        <div class="top-left"><button class="menu-toggle icon-button" id="menu-toggle" aria-label="เปิดเมนู" aria-expanded="false"><span data-icon="menu"></span></button><span class="breadcrumb">AFFILIATE LAB <span class="breadcrumb-sep">/</span> <strong id="page-crumb">PUBLISHER</strong></span></div>
        <div class="top-right"><span class="live-dot" aria-hidden="true"></span><span class="time-label" id="clock">Asia/Bangkok</span><span class="top-divider"></span><span class="mode-tag" title="ยังไม่ได้เชื่อม Shopee API">Assisted mode</span><button class="btn btn-primary top-create" data-action="new"><span data-icon="plus"></span> สร้างโพสต์</button></div>
      </header>
      <main class="main-content">
        <section id="view" aria-live="polite"></section>
      </main>
      <footer class="site-footer"><span>SHOPEE VIDEO PUBLISHER · AFFILIATE LAB</span><span>ยังไม่เชื่อม API เผยแพร่ — ทุกโพสต์ต้องยืนยันใน Shopee ด้วยตนเอง</span></footer>
    </div>
  </div>
  <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>
  <div class="toast-host" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-root" id="modal-root"></div>
  <input id="restore-file" type="file" hidden accept=".json,application/json">
  <script defer src="./app.js?v=1"></script>
</body>
</html>
